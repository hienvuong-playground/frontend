apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apex-redirect
spec:
  parentRefs:
    - name: public
      namespace: istio-ingress
      sectionName: https-apex
  hostnames:
    - "${DOMAIN_NAME}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: "www.${DOMAIN_NAME}"
            statusCode: 301
